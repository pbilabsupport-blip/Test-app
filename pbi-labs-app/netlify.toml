[build]
  # CI=false forces Netlify to ignore minor warnings and build the program
  command = "CI= npm run build"
  publish = "build"

# THE API BRIDGE: Reroutes Gumroad to Supabase
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# THE APP ROUTER: Prevents white screens on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200