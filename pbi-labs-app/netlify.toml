[build]
  # Fixed: Removed the loose space that caused exit code 127
  command = "CI=true npm run build"
  publish = "build"

# THE API BRIDGE: Reroutes Gumroad to Supabase
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# THE APP ROUTER: Prevents white screens on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200